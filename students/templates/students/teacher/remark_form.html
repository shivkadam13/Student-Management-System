{% extends 'students/base.html' %}

{% block title %}{{ heading }}{% endblock %}

{% block content %}
    <h1 class="h3 mb-4">{{ heading }}</h1>

    <div class="card shadow-sm border-0" style="max-width: 480px;">
        <div class="card-body">
            <form method="post" novalidate>
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label" for="{{ form.remark_text.id_for_label }}">Remark</label>
                    {{ form.remark_text }}
                    {% if form.remark_text.errors %}<div class="text-danger small mt-1">{{ form.remark_text.errors.0 }}</div>{% endif %}
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Save</button>
                    <a href="{% url 'teacher_student_detail' student.pk %}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
{% endblock %}
