{% extends 'students/base.html' %}

{% block title %}{{ heading }}{% endblock %}

{% block content %}
    <div class="card shadow-sm border-0" style="max-width: 520px;">
        <div class="card-body">
            <h1 class="h5 mb-3"><i class="bi bi-exclamation-triangle text-danger"></i> {{ heading }}</h1>
            <p>{{ description }}</p>
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Yes, delete</button>
                <a href="{{ cancel_url }}" class="btn btn-outline-secondary">Cancel</a>
            </form>
        </div>
    </div>
{% endblock %}
